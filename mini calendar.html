<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>mini calendar — life-ing life</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #19161C;
    --card: #211C29;
    --ink: #F1EDE7;
    --ink-soft: #9C93A8;
    --purple: #9B7EDE;
    --purple-soft: rgba(155,126,222,0.14);
    --line: rgba(155,126,222,0.16);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background: var(--bg); font-family:'Work Sans',sans-serif;
  }
  .cal-widget{
    width: 300px; background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 20px 20px 16px; color: var(--ink);
  }
  .cal-head{
    display:flex; align-items:center; justify-content:space-between; margin-bottom: 16px;
  }
  .cal-head .month{
    font-family:'Fraunces',serif; font-weight:500; font-size: 17px;
  }
  .cal-head .nav{ display:flex; gap: 6px; }
  .cal-head button{
    background: none; border: 1px solid var(--line); color: var(--ink-soft);
    width: 26px; height: 26px; border-radius: 6px; cursor: pointer;
    font-size: 13px; display:flex; align-items:center; justify-content:center;
    transition: all 0.15s ease;
  }
  .cal-head button:hover{ background: var(--purple-soft); color: var(--purple); border-color: var(--purple); }

  .dow-row{ display:grid; grid-template-columns: repeat(7,1fr); margin-bottom: 4px; }
  .dow-row span{
    text-align:center; font-size: 10.5px; color: var(--ink-soft); padding-bottom: 6px;
    text-transform: lowercase;
  }

  .day-grid{ display:grid; grid-template-columns: repeat(7,1fr); gap: 3px; }
  .day-cell{
    position:relative; aspect-ratio: 1; display:flex; align-items:center; justify-content:center;
    font-size: 12.5px; border-radius: 7px; cursor: pointer; color: var(--ink);
    transition: background 0.15s ease;
  }
  .day-cell:hover{ background: var(--purple-soft); }
  .day-cell.muted{ color: var(--ink-soft); opacity: 0.35; }
  .day-cell.today{ background: var(--purple); color: #19161C; font-weight: 600; }
  .day-cell.today:hover{ background: var(--purple); }
  .day-cell .dot{
    position:absolute; bottom: 4px; left:50%; transform:translateX(-50%);
    width: 4px; height: 4px; border-radius: 50%; background: var(--purple);
  }
  .day-cell.today .dot{ background: #19161C; }
  .day-cell.selected{ outline: 1.5px solid var(--purple); }

  .cal-footer{
    margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.06);
    font-size: 12px; color: var(--ink-soft); min-height: 16px;
  }
  .cal-footer strong{ color: var(--ink); font-weight: 500; }
</style>
</head>
<body>

<div class="cal-widget">
  <div class="cal-head">
    <div class="nav">
      <button id="prevBtn">‹</button>
    </div>
    <div class="month" id="monthLabel"></div>
    <div class="nav">
      <button id="nextBtn">›</button>
    </div>
  </div>
  <div class="dow-row">
    <span>s</span><span>m</span><span>t</span><span>w</span><span>t</span><span>f</span><span>s</span>
  </div>
  <div class="day-grid" id="dayGrid"></div>
  <div class="cal-footer" id="footer">tap a date to see what's on</div>
</div>

<script>
// sample events — swap this out for your own dates (format: 'YYYY-M-D')
const events = {
  '2026-9-10': 'HSC website review',
  '2026-9-14': "today's focus: recap draft",
  '2026-9-17': 'Food for the Poor sync',
  '2026-9-19': 'Monthly review due',
  '2026-9-25': 'Voucher tracker deadline',
};

let current = new Date();
let viewYear = current.getFullYear();
let viewMonth = current.getMonth();

const monthLabel = document.getElementById('monthLabel');
const dayGrid = document.getElementById('dayGrid');
const footer = document.getElementById('footer');

const monthNames = ['january','february','march','april','may','june','july','august','september','october','november','december'];

function key(y,m,d){ return `${y}-${m+1}-${d}`; }

function render(){
  dayGrid.innerHTML = '';
  monthLabel.textContent = `${monthNames[viewMonth]} ${viewYear}`;

  const firstDay = new Date(viewYear, viewMonth, 1).getDay();
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();

  const cells = [];
  for(let i = firstDay - 1; i >= 0; i--){
    cells.push({ day: daysInPrevMonth - i, muted: true });
  }
  for(let d = 1; d <= daysInMonth; d++){
    cells.push({ day: d, muted: false });
  }
  while(cells.length % 7 !== 0){
    cells.push({ day: cells.length - (firstDay + daysInMonth) + 1, muted: true });
  }

  cells.forEach(c => {
    const cell = document.createElement('div');
    cell.className = 'day-cell' + (c.muted ? ' muted' : '');

    const isToday = !c.muted && viewYear === current.getFullYear() && viewMonth === current.getMonth() && c.day === current.getDate();
    if(isToday) cell.classList.add('today');

    const ev = !c.muted ? events[key(viewYear, viewMonth, c.day)] : null;

    cell.innerHTML = `${c.day}${ev ? '<span class="dot"></span>' : ''}`;

    if(!c.muted){
      cell.onclick = () => {
        document.querySelectorAll('.day-cell.selected').forEach(el => el.classList.remove('selected'));
        cell.classList.add('selected');
        footer.innerHTML = ev
          ? `<strong>${monthNames[viewMonth]} ${c.day}</strong> — ${ev}`
          : `<strong>${monthNames[viewMonth]} ${c.day}</strong> — nothing scheduled`;
      };
    }

    dayGrid.appendChild(cell);
  });
}

document.getElementById('prevBtn').onclick = () => {
  viewMonth--;
  if(viewMonth < 0){ viewMonth = 11; viewYear--; }
  render();
};
document.getElementById('nextBtn').onclick = () => {
  viewMonth++;
  if(viewMonth > 11){ viewMonth = 0; viewYear++; }
  render();
};

render();
</script>
</body>
</html>
